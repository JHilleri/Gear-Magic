<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="Aether &amp; Iron — a turn-based fantasy 4X of steel, sorcery and stone." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Aether &amp; Iron</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #0b0d10; color: #e8dcc0;
        -webkit-font-smoothing: antialiased; overscroll-behavior: none;
      }
      body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game-root { position: fixed; inset: 0; overflow: hidden; }
      #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      /* The HUD overlay lets pointer events fall through to the map; UI panels opt back in. */
      #ui-root { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: radial-gradient(ellipse at 50% 42%, #221d16 0%, #0b0d10 70%); transition: opacity 0.4s ease;
      }
      #boot-splash .t {
        font: 900 clamp(32px, 6vw, 64px) / 1 Cinzel, Georgia, serif; letter-spacing: 0.08em; color: #e8c35a;
        text-shadow: 0 2px 0 #4a3512, 0 0 28px rgba(232, 195, 90, 0.25);
      }
      #boot-splash .s { font: 500 14px 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; color: #9a8f78; }
      #boot-splash .r {
        width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(232, 195, 90, 0.18); border-top-color: #e8c35a;
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .r { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="scene" tabindex="-1"></canvas>
      <div id="ui-root"></div>
    </div>
    <div id="boot-splash" aria-hidden="true">
      <div class="t">Aether &amp; Iron</div>
      <div class="r"></div>
      <div class="s">Kindling the forges</div>
    </div>
    <noscript>
      <p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:18px sans-serif">Aether &amp; Iron needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
