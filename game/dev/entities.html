<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entities Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0e14; color: #eadfc8; font-family: 'Alegreya Sans', system-ui, sans-serif; overflow: hidden; }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #panel { position: fixed; top: 10px; left: 10px; width: 300px; max-height: calc(100% - 20px); overflow-y: auto; background: rgba(16, 13, 10, 0.86);
        border: 1px solid #6b5630; border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 30px rgba(0,0,0,0.5); font-size: 13px; }
      #panel h1 { font-family: Cinzel, serif; font-size: 16px; margin: 0 0 6px; color: #e8c35a; letter-spacing: 0.04em; }
      #panel h2 { font-family: Cinzel, serif; font-size: 12px; margin: 10px 0 4px; color: #c9a85a; text-transform: uppercase; letter-spacing: 0.08em; }
      #panel button { background: linear-gradient(#3a2f22, #241c14); color: #f0e2c4; border: 1px solid #7a6238; border-radius: 4px; padding: 3px 7px; margin: 2px 2px 2px 0;
        font: inherit; font-size: 12px; cursor: pointer; }
      #panel button:hover { border-color: #e8c35a; color: #fff6df; }
      #panel select { width: 100%; background: #1c1610; color: #f0e2c4; border: 1px solid #7a6238; border-radius: 4px; padding: 3px; font: inherit; margin: 2px 0; }
      #panel label { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; }
      #stats { position: fixed; right: 10px; top: 10px; font: 12px monospace; color: #b9ad94; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="panel"></div>
    <div id="stats"></div>
    <script type="module" src="/src/dev/entities-dev.ts"></script>
  </body>
</html>
